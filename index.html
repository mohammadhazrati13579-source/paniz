<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paniz Memory</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 320px;
    background: linear-gradient(145deg,#111,#050505);
    border: 1px solid #5b0000;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 0 40px rgba(120,0,0,.4);
}

.floppy {
    width: 120px;
    height: 120px;
    margin: auto;
    background: #111;
    border: 3px solid #8b0000;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

h1 {
    margin-top:25px;
    color:#ff3b3b;
}

p {
    color:#bbb;
}

button {
    margin-top:20px;
    padding:12px 25px;
    border-radius:30px;
    border:none;
    background:#8b0000;
    color:white;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="card">

<div class="floppy">
💾
</div>

<h1>Paniz</h1>

<p>
A little memory stored forever.
</p>

<p>
Kanye West — Runaway
</p>

<button>
Open Memory
</button>

</div>

</body>
</html>
