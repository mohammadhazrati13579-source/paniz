<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paniz Memory</title>

<style>

body {
    margin:0;
    height:100vh;
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.card {
    width:330px;
    background:#0d0d0d;
    border:1px solid #600000;
    border-radius:22px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 50px rgba(130,0,0,.5);
    animation:fade 2s ease;
}

.floppy {
    width:130px;
    height:130px;
    margin:auto;
    background:#111;
    border:3px solid #a00000;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    animation:pulse 2s infinite;
}

h1 {
    color:#ff4040;
    margin-bottom:10px;
}

.memory {
    color:#ccc;
    font-size:16px;
    animation:slide 2s ease;
}

button {
    margin-top:25px;
    padding:13px 30px;
    border:none;
    border-radius:30px;
    background:#8b0000;
    color:white;
    font-size:15px;
}

@keyframes fade {
    from {
        opacity:0;
        transform:scale(.8);
    }
    to {
        opacity:1;
        transform:scale(1);
    }
}

@keyframes pulse {
    0%,100% {
        box-shadow:0 0 10px #700000;
    }
    50% {
        box-shadow:0 0 35px #ff0000;
    }
}

@keyframes slide {
    from {
        opacity:0;
        transform:translateY(30px);
    }
    to {
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="card">

<div class="floppy">
💾
</div>

<h1>Paniz</h1>

<div class="memory">
512 days ago,<br>
a memory started...
</div>

<p>
Kanye West — Runaway
</p>

<button>
Open Memory
</button>

</div>

</body>
</html>
