<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paniz Memory</title>


<style>

body{
margin:0;
height:100vh;
background:#050505;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
}


.card{

width:330px;
background:#0d0d0d;
border:1px solid #700000;
border-radius:22px;
padding:30px;
text-align:center;
box-shadow:0 0 50px rgba(150,0,0,.5);

}



.floppy{

width:130px;
height:130px;
margin:auto;

background:#151515;

border:3px solid #900;

border-radius:12px;

position:relative;

overflow:hidden;

box-shadow:0 0 25px rgba(255,0,0,.5);

animation:glow 2s infinite;

transition:1s;

}



.floppy-label{

position:absolute;

top:40px;

left:15px;

width:100px;

height:40px;

background:#222;

border:1px solid #900;

display:flex;

justify-content:center;

align-items:center;

font-size:13px;

color:#ff4040;

}



.floppy-slot{

position:absolute;

top:10px;

right:15px;

width:25px;

height:8px;

background:#555;

}



.floppy-metal{

position:absolute;

bottom:0;

left:25px;

width:80px;

height:18px;

background:#444;

}



.floppy.open{

transform:scale(0) rotate(180deg);

opacity:0;

}



@keyframes glow{

0%,100%{
box-shadow:0 0 10px #700000;
}

50%{
box-shadow:0 0 35px red;
}

}



h1{

color:#ff4040;

}



.memory{

color:#ccc;

line-height:1.6;

}



button{

margin-top:15px;

padding:12px 25px;

border:none;

border-radius:30px;

background:#900;

color:white;

font-size:15px;

}



.files{

margin-top:25px;

display:flex;

flex-direction:column;

gap:12px;

}



.file{

background:#151515;

border:1px solid #700;

padding:12px;

border-radius:12px;

cursor:pointer;

}



.gallery{

display:flex;

gap:10px;

justify-content:center;

flex-wrap:wrap;

margin-top:20px;

}



.gallery img{

width:90px;

height:90px;

object-fit:cover;

border-radius:12px;

border:2px solid #900;

}



.lightbox,
.letter{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.85);

justify-content:center;

align-items:center;

z-index:100;

}



.lightbox img{

max-width:90%;

max-height:80%;

border:3px solid #900;

border-radius:20px;

}



.paper{

width:300px;

background:#f5e6c8;

color:#3b2415;

padding:25px;

border-radius:10px;

text-align:left;

font-family:Georgia,serif;

line-height:1.7;

box-shadow:0 0 40px black;

}



</style>
</head>


<body>



<div class="lightbox" id="lightbox" onclick="closeImage()">

<img id="bigImage">

</div>



<div class="letter" id="letter" onclick="closeLetter()">

<div class="paper" onclick="event.stopPropagation()">


<h2>
Dear Paniz ❤️
</h2>


<p id="letterText"></p>


</div>

</div>




<div class="card" id="card">



<div class="floppy">


<div class="floppy-label">

PANIZ & MMZY

</div>


<div class="floppy-slot"></div>


<div class="floppy-metal"></div>


</div>




<h1>

Paniz

</h1>



<div class="memory">

512 days ago,<br>

a memory started...

</div>



<p>

Kanye West — Runaway

</p>



<button onclick="openMemory()">

Open Memory

</button>



</div>






<script>


const letter = `

I don’t know if a file on an old floppy disk can truly carry a feeling...

but if it can, I want this one to hold the little moments that made us who we are.


512 days ago, something began.

Something soft, unexpected, and real.


Not just a date, not just a memory...

a story.


I still remember the day we made that Lego flower together.

It was such a simple thing, just some little pieces put together,

but somehow it became something much bigger.


Because it wasn’t really about the flower.

It was about sitting there together, creating something with our own hands,

laughing, and turning tiny pieces into a memory that stayed.


Maybe someone else would just see a Lego flower...

but for me, it will always be that little thing we made together.


Thank you for finding me.

Thank you for being part of my story.


With love ❤️

— MMZY

`;





function openMemory(){


document.querySelector(".floppy").classList.add("open");



setTimeout(()=>{


document.getElementById("card").innerHTML = `


<h1>
Our Memory ❤️
</h1>


<div class="memory">

512 days ago,<br>

a little story started...

</div>



<div class="files">


<div class="file" onclick="openLetter()">

💌 Love Letter.txt

</div>



<div class="file">

🎵 Runaway.mp3

</div>



</div>



<div class="gallery">


<img onclick="openImage(this.src)" src="https://res.cloudinary.com/mydmpaxs/image/upload/v1785572950/paniz1_x4plhp.jpg">


<img onclick="openImage(this.src)" src="https://res.cloudinary.com/mydmpaxs/image/upload/v1785573340/paniz2_twj8aq.jpg">


<img onclick="openImage(this.src)" src="https://res.cloudinary.com/mydmpaxs/image/upload/v1785572950/paniz3_rmptdo.jpg">


</div>




<button onclick="playMusic()">

▶ Play Runaway

</button>



<audio id="song">

<source src="https://raw.githubusercontent.com/mohammadhazrati13579-source/paniz/main/09%20Kanye%20West%20-%20Runaway.mp3">

</audio>



`;



},1000);



}





function openLetter(){


document.getElementById("letter").style.display="flex";


let i=0;

let output="";

let speed=60;


let interval=setInterval(()=>{


output+=letter[i];


document.getElementById("letterText").innerText=output;


i++;


if(i>=letter.length){

clearInterval(interval);

}


},speed);


}





function closeLetter(){

document.getElementById("letter").style.display="none";

}




function openImage(src){

document.getElementById("bigImage").src=src;

document.getElementById("lightbox").style.display="flex";

}



function closeImage(){

document.getElementById("lightbox").style.display="none";

}




function playMusic(){

let song=document.getElementById("song");


if(song.paused){

song.play();

}

else{

song.pause();

}


}


</script>


</body>

</html>
