<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paniz Memory</title>

<style>

body{
    margin:0;
    height:100vh;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}


.card{
    width:330px;
    background:#0d0d0d;
    border:1px solid #700000;
    border-radius:22px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 50px rgba(150,0,0,.5);
}


.floppy{

    width:130px;
    height:130px;

    margin:auto;

    background:#111;

    border:3px solid #a00000;

    border-radius:15px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:55px;

    animation:glow 2s infinite;

    transition:1s;
}


.floppy.open{

    transform:scale(0) rotate(180deg);

    opacity:0;

}


@keyframes glow{

0%,100%{
box-shadow:0 0 10px #700000;
}

50%{
box-shadow:0 0 35px red;
}

}


h1{
    color:#ff4040;
}


.memory{
    color:#ccc;
    line-height:1.6;
}


button{

    margin-top:20px;

    padding:13px 30px;

    border:none;

    border-radius:30px;

    background:#900000;

    color:white;

    font-size:16px;

}


.gallery{

    display:flex;

    gap:15px;

    justify-content:center;

    flex-wrap:wrap;

    margin-top:25px;

}


.gallery img{

    width:95px;

    height:95px;

    object-fit:cover;

    border-radius:12px;

    border:2px solid #900;

    box-shadow:0 0 20px rgba(255,0,0,.5);

    transition:.4s;

}


.gallery img:hover{

    transform:scale(1.3);

}



.lightbox{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:rgba(0,0,0,.85);

    justify-content:center;

    align-items:center;

    z-index:100;

}



.lightbox img{

    max-width:90%;

    max-height:80%;

    border-radius:20px;

    border:3px solid #900;

}


</style>

</head>


<body>


<div class="lightbox" id="lightbox" onclick="closeImage()">

<img id="bigImage">

</div>



<div class="card" id="card">


<div class="floppy">

💾

</div>


<h1>

Paniz

</h1>


<div class="memory">

512 days ago,<br>

a memory started...

</div>


<p>

Kanye West — Runaway

</p>


<button onclick="openMemory()">

Open Memory

</button>


</div>



<script>


function openMemory(){


document.querySelector(".floppy").classList.add("open");


setTimeout(function(){


document.getElementById("card").innerHTML = `


<h1>
Our Memory ❤️
</h1>


<div class="memory">

512 days ago,<br>

a little story started...

</div>



<div class="gallery">


<img onclick="openImage(this.src)" src="https://raw.githubusercontent.com/mohammadhazrati13579-source/paniz/main/paniz1.jpg">


<img onclick="openImage(this.src)" src="https://raw.githubusercontent.com/mohammadhazrati13579-source/paniz/main/paniz2.jpg">


<img onclick="openImage(this.src)" src="https://raw.githubusercontent.com/mohammadhazrati13579-source/paniz/main/paniz3.jpg">


</div>



<button onclick="playMusic()">

▶ Play Runaway

</button>



<audio id="song">

<source src="https://raw.githubusercontent.com/mohammadhazrati13579-source/paniz/main/09%20Kanye%20West%20-%20Runaway.mp3">

</audio>


`;


},1000);


}



function openImage(src){

document.getElementById("bigImage").src=src;

document.getElementById("lightbox").style.display="flex";

}



function closeImage(){

document.getElementById("lightbox").style.display="none";

}



function playMusic(){

let song=document.getElementById("song");


if(song.paused){

song.play();

}

else{

song.pause();

}


}


</script>


</body>

</html>
